name: Rust CI

on:
  push:
    branches:
      - main
      - dev
      - dev-starfish
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-ci:
    permissions:
      contents: read
      pull-requests: write
      pages: write
      id-token: write
    uses: qubit-ltd/rs-infra-ci/.github/workflows/github-ci.yml@main
    with:
      feature-matrix-prefetch: true

  dependency-policy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-platform/rs-model-metadata
    steps:
      - uses: actions/checkout@v6
        with:
          path: rust-platform/rs-model-metadata
          submodules: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-codec
          ref: main
          path: rust-platform/rs-codec
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-reflect
          ref: main
          path: rust-platform/rs-reflect
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-id
          ref: main
          path: rust-common/rs-id
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-datatype
          ref: main
          path: rust-common/rs-datatype
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-redact
          ref: main
          path: rust-common/rs-redact
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-validator
          ref: main
          path: rust-common/rs-validator
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-validation-rules
          ref: main
          path: rust-common/rs-validation-rules
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - run: ./.infra/bin/prepare-local-path-dependencies.sh
      - run: ./.infra/bin/dependency-update.sh --check


  deploy-pages:
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: rust-ci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5


  cross-platform-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows
          - os: macos-15
            target: macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust-platform/rs-model-metadata
    steps:
      - uses: actions/checkout@v6
        with:
          path: rust-platform/rs-model-metadata
          submodules: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-codec
          ref: main
          path: rust-platform/rs-codec
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-reflect
          ref: main
          path: rust-platform/rs-reflect
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-id
          ref: main
          path: rust-common/rs-id
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-datatype
          ref: main
          path: rust-common/rs-datatype
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-redact
          ref: main
          path: rust-common/rs-redact
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-validator
          ref: main
          path: rust-common/rs-validator
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-validation-rules
          ref: main
          path: rust-common/rs-validation-rules
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
          components: clippy
      - run: cargo test --workspace --all-features --locked --verbose
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
