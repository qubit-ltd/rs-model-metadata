name: Rust CI

on:
  push:
    branches:
      - main
      - dev
      - dev-starfish
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-ci:
    permissions:
      contents: read
      pull-requests: write
      pages: write
      id-token: write
    uses: qubit-ltd/rs-infra-ci/.github/workflows/github-ci.yml@c2beddb6d00df07706a51d483649efb1ced4f532
    with:
      feature-matrix-prefetch: true

  dependency-policy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      RS_REFLECT_VNEXT_SHA: ${{ vars.RS_REFLECT_VNEXT_SHA }}
      DEPENDENCY_TOKEN: ${{ secrets.DEPENDENCY_TOKEN }}
    defaults:
      run:
        working-directory: rust-platform/rs-model-metadata
    steps:
      - name: Require private checkout credentials and the rs-reflect vNext revision
        shell: bash
        working-directory: .
        run: |
          if [[ -z "$DEPENDENCY_TOKEN" ]]; then
            echo "Required secret DEPENDENCY_TOKEN is missing for the trusted dependency policy job." >&2
            exit 1
          fi
          if [[ ! "$RS_REFLECT_VNEXT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Required repository variable RS_REFLECT_VNEXT_SHA must be set to the rs-reflect vNext commit SHA." >&2
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          path: rust-platform/rs-model-metadata
          submodules: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-reflect
          ref: ${{ vars.RS_REFLECT_VNEXT_SHA }}
          path: rust-platform/rs-reflect
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-validator
          ref: fcc87549760f4b4c4727f1b1d5d3c22055909d10
          path: rust-common/rs-validator
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-validation-rules
          ref: e8806ca2ce0a30a53a58122e361eda622faee67b
          path: rust-common/rs-validation-rules
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - run: ./.infra/bin/prepare-local-path-dependencies.sh
      - run: ./.infra/bin/dependency-update.sh --check
  cross-platform-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows
          - os: macos-15
            target: macos
    runs-on: ${{ matrix.os }}
    env:
      RS_REFLECT_VNEXT_SHA: ${{ vars.RS_REFLECT_VNEXT_SHA }}
      DEPENDENCY_TOKEN: ${{ secrets.DEPENDENCY_TOKEN }}
    defaults:
      run:
        working-directory: rust-platform/rs-model-metadata
    steps:
      - name: Require private checkout credentials and the rs-reflect vNext revision
        shell: bash
        working-directory: .
        run: |
          if [[ -z "$DEPENDENCY_TOKEN" ]]; then
            echo "Required secret DEPENDENCY_TOKEN is missing for the trusted cross-platform job." >&2
            exit 1
          fi
          if [[ ! "$RS_REFLECT_VNEXT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Required repository variable RS_REFLECT_VNEXT_SHA must be set to the rs-reflect vNext commit SHA." >&2
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          path: rust-platform/rs-model-metadata
          submodules: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-reflect
          ref: ${{ vars.RS_REFLECT_VNEXT_SHA }}
          path: rust-platform/rs-reflect
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-validator
          ref: fcc87549760f4b4c4727f1b1d5d3c22055909d10
          path: rust-common/rs-validator
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-validation-rules
          ref: e8806ca2ce0a30a53a58122e361eda622faee67b
          path: rust-common/rs-validation-rules
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
          components: clippy
      - run: cargo test --workspace --all-features --locked --verbose
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  fork-private-checks-skipped:
    name: Private dependency checks skipped for fork PR
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Explain private checks skip
        run: |
          echo "Private dependency policy and cross-platform checks were skipped for this fork pull request. The public Rust CI job still runs." >> "$GITHUB_STEP_SUMMARY"
