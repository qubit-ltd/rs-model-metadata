name: rs-platform downstream

on:
  push:
    branches:
      - dev
      - main
      - dev-starfish
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-compatibility:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - id: dependency_token
        name: Check cross-repository access
        env:
          DEPENDENCY_TOKEN: ${{ secrets.DEPENDENCY_TOKEN }}
          RS_REFLECT_VNEXT_SHA: ${{ vars.RS_REFLECT_VNEXT_SHA }}
          RS_PLATFORM_VNEXT_SHA: ${{ vars.RS_PLATFORM_VNEXT_SHA }}
        run: |
          if [[ -z "$DEPENDENCY_TOKEN" ]]; then
            echo "Required secret DEPENDENCY_TOKEN is missing for the trusted platform compatibility job." >&2
            exit 1
          fi
          if [[ ! "$RS_REFLECT_VNEXT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Required repository variable RS_REFLECT_VNEXT_SHA must be set to the rs-reflect vNext commit SHA." >&2
            exit 1
          fi
          if [[ ! "$RS_PLATFORM_VNEXT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Required repository variable RS_PLATFORM_VNEXT_SHA must be set to the migrated rs-platform commit SHA." >&2
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Check out metadata under the platform sibling layout
        if: steps.dependency_token.outputs.available == 'true'
        uses: actions/checkout@v6
        with:
          path: platform/rs-model-metadata

      - name: Check out platform dependencies
        if: steps.dependency_token.outputs.available == 'true'
        uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-reflect
          ref: ${{ vars.RS_REFLECT_VNEXT_SHA }}
          path: platform/rs-reflect
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}

      - uses: actions/checkout@v6
        if: steps.dependency_token.outputs.available == 'true'
        with:
          repository: qubit-ltd/rs-platform
          ref: ${{ vars.RS_PLATFORM_VNEXT_SHA }}
          path: platform/rs-platform
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}

      - name: Check out Rust common path dependencies
        if: steps.dependency_token.outputs.available == 'true'
        uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-id
          ref: 7425188a7fdebcc94aac9915bcc79c535b3eb1db
          path: rust-common/rs-id
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}

      - uses: actions/checkout@v6
        if: steps.dependency_token.outputs.available == 'true'
        with:
          repository: qubit-ltd/rs-datatype
          ref: 48c4aee096f97c483dd44d6ded00bd166ccb0985
          path: rust-common/rs-datatype
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}

      - uses: actions/checkout@v6
        if: steps.dependency_token.outputs.available == 'true'
        with:
          repository: qubit-ltd/rs-redact
          ref: 5b992b879ab1bbff5a34c141693d0c6334604cdc
          path: rust-common/rs-redact
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}

      - uses: actions/checkout@v6
        if: steps.dependency_token.outputs.available == 'true'
        with:
          repository: qubit-ltd/rs-redact-derive
          ref: fdb0ad4b73d5a22745d5db1326075eaa852ec483
          path: rust-common/rs-redact-derive
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}

      - uses: actions/checkout@v6
        if: steps.dependency_token.outputs.available == 'true'
        with:
          repository: qubit-ltd/rs-codec
          ref: 975501f075de49cfb3c473c5048137daec608b43
          path: rust-common/rs-codec
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}

      - uses: actions/checkout@v6
        if: steps.dependency_token.outputs.available == 'true'
        with:
          repository: qubit-ltd/rs-validator
          ref: fb64546a16ca7659e10d9296728e1cfdace86de0
          path: rust-common/rs-validator
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}

      - name: Check out validation rule definitions
        if: steps.dependency_token.outputs.available == 'true'
        uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-validation-rules
          ref: 815b4bc35f69e8e0b6ae29459497d59dd50a0a4c
          path: rust-common/rs-validation-rules
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}

      - name: Install the platform build toolchain
        if: steps.dependency_token.outputs.available == 'true'
        run: rustup toolchain install 1.94.0 --profile minimal

      - name: Test the downstream platform workspace
        if: steps.dependency_token.outputs.available == 'true'
        working-directory: platform/rs-platform
        run: cargo +1.94.0 test --workspace --all-features

      - name: Build downstream platform documentation
        if: steps.dependency_token.outputs.available == 'true'
        working-directory: platform/rs-platform
        run: RUSTDOCFLAGS=-D warnings cargo +1.94.0 doc --workspace --no-deps


  fork-pull-request:
    name: Private platform compatibility skipped for fork PR
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Report private downstream check skipped
        run: |
          echo "Platform compatibility was skipped for this fork pull request because the private rs-platform repository cannot be checked out with fork PR credentials." >> "$GITHUB_STEP_SUMMARY"
