[package]
name = "qubit-model-derive"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-model-derive"
description = "Derive macros for Qubit Rust model metadata"
homepage = "https://github.com/qubit-ltd/rs-model-derive"
documentation = "https://docs.rs/qubit-model-derive"
readme = "README.md"
keywords = ["derive", "macro", "metadata", "model", "qubit"]
categories = ["development-tools::procedural-macro-helpers"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/src/**",
    "/doc/**",
    "/tests/**",
]

[lib]
name = "qubit_model_derive"
proc-macro = true

[dependencies]
